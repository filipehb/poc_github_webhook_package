# Compose de producao para a droplet (checkin-discord-bot-v1).
# Copie para /opt/checkin-discord-bot-v1/deploy/docker-compose.yml
# O webhook Node.js roda separado via systemd (nao use o servico webhook em Go).

services:
  db:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      TZ: "UTC"
    volumes:
      - ../docker:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    image: ${DOCKER_IMAGE:?Defina DOCKER_IMAGE em deploy/.env}
    container_name: node_app
    restart: always
    env_file:
      - ../.env
    volumes:
      - ../.env:/opt/checkin-app/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npm start"

volumes:
  db_data:
